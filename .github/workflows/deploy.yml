name: Deploy HCAI Answer

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      APP_NAME: hcai-answer
      SERVICE_NAME: hcai-answer
      APP_DIR: /opt/hcai-answer
      WEB_DIR: /www/wwwroot/chat.hctopup.com

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.1"
          cache: true

      - name: Test backend
        run: go test ./...

      - name: Build backend
        run: |
          mkdir -p dist
          VERSION="$(git describe --tags --always --dirty 2>/dev/null || echo dev)"
          REVISION="$(git rev-parse --short HEAD)"
          BUILD_TIME="$(date +%s)"
          go build \
            -ldflags="-X github.com/apache/answer/cmd.Version=${VERSION} -X github.com/apache/answer/cmd.Revision=${REVISION} -X github.com/apache/answer/cmd.Time=${BUILD_TIME}" \
            -o dist/answer \
            ./cmd/answer

      - name: Set release name
        run: |
          SHORT_SHA="${GITHUB_SHA::12}"
          echo "SHORT_SHA=${SHORT_SHA}" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.7.0 --activate

      - name: Build frontend
        working-directory: ui
        run: |
          pnpm pre-install
          pnpm build

      - name: Package release
        run: |
          mkdir -p deploy/app
          mkdir -p deploy/ui

          cp dist/answer deploy/app/answer
          cp -R ui/build/. deploy/ui/

          tar -C deploy -czf "release-${SHORT_SHA}.tar.gz" app ui

      - name: Upload release
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          test -n "$SSH_KEY" || (echo "DEPLOY_SSH_KEY is empty" && exit 1)
          test -n "$DEPLOY_HOST" || (echo "DEPLOY_HOST is empty" && exit 1)
          test -n "$DEPLOY_PORT" || (echo "DEPLOY_PORT is empty" && exit 1)
          test -n "$DEPLOY_USER" || (echo "DEPLOY_USER is empty" && exit 1)

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -T 10 -p "$DEPLOY_PORT" "$DEPLOY_HOST" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "echo connected to \$(hostname)"

          scp -i ~/.ssh/deploy_key -P "$DEPLOY_PORT" \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 \
            "release-${SHORT_SHA}.tar.gz" \
            "${DEPLOY_USER}@${DEPLOY_HOST}:/tmp/${APP_NAME}-${SHORT_SHA}.tar.gz"

      - name: Activate release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "APP_DIR='${APP_DIR}' WEB_DIR='${WEB_DIR}' SERVICE_NAME='${SERVICE_NAME}' APP_NAME='${APP_NAME}' SHORT_SHA='${SHORT_SHA}' bash -s" <<'EOF'
          set -euo pipefail

          WORK_DIR="/tmp/${APP_NAME}-${SHORT_SHA}"
          rm -rf "${WORK_DIR}"
          mkdir -p "${WORK_DIR}"

          sudo mkdir -p "${WEB_DIR}"
          sudo mkdir -p "${APP_DIR}"

          tar -C "${WORK_DIR}" -xzf "/tmp/${APP_NAME}-${SHORT_SHA}.tar.gz"

          sudo install -m 755 "${WORK_DIR}/app/answer" "${APP_DIR}/answer"
          sudo rsync -a --delete --exclude='.user.ini' "${WORK_DIR}/ui/" "${WEB_DIR}/"

          if [ -L "${APP_DIR}/app" ]; then
            sudo rm -f "${APP_DIR}/app"
          fi
          sudo systemctl restart "${SERVICE_NAME}"

          rm -rf "${WORK_DIR}"
          rm -f "/tmp/${APP_NAME}-${SHORT_SHA}.tar.gz"
          EOF
